<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Hacker News のトップ記事を日本語タイトル・要約付きで毎日更新{% endblock %}">
  <link rel="icon" href="{{ base_url }}assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="{{ site_name }}" href="{{ base_url }}feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ base_url }}assets/style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>
  <a class="skip-link" href="#main">本文へ</a>

  <header class="topbar">
    <a class="brand" href="{{ base_url }}index.html">{{ site_name }}</a>
    <nav class="nav" aria-label="主要">
      <a href="{{ base_url }}index.html">最新</a>
      <a href="{{ base_url }}archive/index.html">アーカイブ</a>
      <a href="{{ base_url }}about.html">About</a>
      <a href="{{ base_url }}feed.xml">RSS</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>{{ site_name }} — 非公式の日本語ダイジェスト。データは Hacker News API から取得しています。</p>
    <p class="muted">生成: {{ generated_at }}</p>
  </footer>

  <script>
    (() => {
      const nodes = document.querySelectorAll("[data-posted-at]");
      const fmt = new Intl.RelativeTimeFormat("ja", { numeric: "auto" });
      const now = Date.now();
      for (const el of nodes) {
        const t = Date.parse(el.getAttribute("data-posted-at") || "");
        if (!Number.isFinite(t)) continue;
        const diffSec = Math.round((t - now) / 1000);
        const abs = Math.abs(diffSec);
        let value = diffSec;
        let unit = "second";
        if (abs >= 86400) { value = Math.round(diffSec / 86400); unit = "day"; }
        else if (abs >= 3600) { value = Math.round(diffSec / 3600); unit = "hour"; }
        else if (abs >= 60) { value = Math.round(diffSec / 60); unit = "minute"; }
        el.textContent = fmt.format(value, unit);
      }
    })();
  </script>
</body>
</html>
